name: CI

on:
  workflow_dispatch:
  push:
    branches: [main, staging, development]
  pull_request:
    branches: [main, staging, development]

permissions:
  contents: read

jobs:
  build-test:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Fixed Node runtime
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
      - name: Fixed package manager
        run: |
          corepack enable
          corepack prepare pnpm@10.6.1 --activate
      - name: Fixed inbox delivery verification
        env:
          DATABASE_URL: postgresql://fixture:fixture@127.0.0.1:1/fixture
        run: |
          python3 - <<'PY'
          import json, pathlib, subprocess, sys, time
          commands = [
            ['timeout', '--signal=TERM', '--kill-after=10s', '600s', 'pnpm', 'install', '--frozen-lockfile', '--ignore-scripts'],
            ['timeout', '--signal=TERM', '--kill-after=10s', '120s', 'pnpm', 'exec', 'prisma', 'generate', '--schema', './libraries/nestjs-libraries/src/database/prisma/schema.prisma'],
            ['timeout', '--signal=TERM', '--kill-after=10s', '180s', 'pnpm', 'exec', 'jest', '--config', './jest.inbox-delivery.config.cjs', '--runInBand', '--cache=false', '--coverage=false', '--testTimeout=5000', '--runTestsByPath', 'apps/backend/src/public-api/routes/v1/public.integrations.inbox-delivery.spec.ts', 'libraries/nestjs-libraries/src/database/prisma/posts/posts.inbox-delivery.spec.ts'],
          ]
          root = pathlib.Path('inbox-verification-evidence')
          root.mkdir()
          remaining = 1048576
          results = []
          failed = 0
          with (root / 'verification.log').open('wb') as log:
            for command in commands:
              start = time.monotonic()
              process = subprocess.Popen(command, stdout=subprocess.PIPE, stderr=subprocess.STDOUT)
              truncated = False
              while True:
                chunk = process.stdout.read(65536)
                if not chunk:
                  break
                allowed = chunk[:remaining]
                remaining -= len(allowed)
                log.write(allowed)
                sys.stdout.buffer.write(allowed)
                sys.stdout.buffer.flush()
                if len(allowed) != len(chunk):
                  truncated = True
              code = process.wait()
              results.append({'command': command, 'exitCode': code, 'seconds': round(time.monotonic()-start, 3), 'logLimitExceeded': truncated})
              if code or truncated:
                failed = code if 0 < code < 256 else 1
                break
          (root / 'result.json').write_text(json.dumps({'commands': results, 'passed': not failed}, indent=2))
          sys.exit(failed)
          PY
      - name: Preserve bounded verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: inbox-delivery-verification
          path: inbox-verification-evidence/
          retention-days: 7
          if-no-files-found: error

  package:
    name: Manual accepted-source Postiz package
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    permissions:
      contents: read
    steps:
      - name: Checkout trusted Main without write credentials
        timeout-minutes: 1
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Bind accepted source and existing recipe
        timeout-minutes: 1
        env:
          WORKFLOW_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$(git rev-parse HEAD)" = "$WORKFLOW_SHA"
          test "$(git rev-parse refs/remotes/origin/main)" = "$WORKFLOW_SHA"
          source=0e537d3935b30010bc1b9b621be56cb06083c31d
          test "$(git rev-parse "$source^{tree}")" = af402b533928f760d0067ecfb3ebc375d857c406
          git merge-base --is-ancestor "$source" "$WORKFLOW_SHA"
          test "$(git diff --no-renames --name-status "$source" "$WORKFLOW_SHA")" = $'M\t.github/workflows/ci.yml'
          mkdir -m 700 "$RUNNER_TEMP/postiz-source" "$RUNNER_TEMP/postiz-package"
          git archive --format=tar "$source" > "$RUNNER_TEMP/postiz-source.tar"
          tar -xf "$RUNNER_TEMP/postiz-source.tar" -C "$RUNNER_TEMP/postiz-source"
          cd "$RUNNER_TEMP/postiz-source"
          printf '%s\n' '99b22b74e660081a0cbffeb5294493270c3ed4cea74c2078aee0623a7f079da1  Dockerfile.dev' '75cfe429fd914344122e3bbed7e6568df5270dc17010332259ea050215412655  package.json' '75b7a994e472d48be947fd6a9e538b65028827210d802abe60543727a99650bf  pnpm-lock.yaml' | sha256sum --check --strict
      - name: Build accepted recipe once with bounded output
        timeout-minutes: 10
        env:
          DOCKER_BUILDKIT: '1'
        run: |
          python3 - <<'PY'
          import json, os, pathlib, signal, subprocess, sys, time
          root=pathlib.Path(os.environ['RUNNER_TEMP']); out=root/'postiz-package'; results=[]; remaining=1048576
          commands=[['timeout','--signal=TERM','--kill-after=5','60','docker','pull','--platform','linux/amd64','node:22.20-bookworm-slim'],['timeout','--signal=TERM','--kill-after=5','540','docker','build','--pull=false','--platform','linux/amd64','--file','Dockerfile.dev','--iidfile',str(out/'image-id'),'--label','org.opencontainers.image.revision=0e537d3935b30010bc1b9b621be56cb06083c31d','--label','one.linktrend.source-tree=af402b533928f760d0067ecfb3ebc375d857c406','.']]
          with (root/'postiz-build.log').open('wb') as log:
              for command in commands:
                  started=time.monotonic(); p=subprocess.Popen(command,cwd=root/'postiz-source',stdout=subprocess.PIPE,stderr=subprocess.STDOUT,start_new_session=True); overflow=False
                  while chunk:=p.stdout.read(65536):
                      allowed=chunk[:remaining]; remaining-=len(allowed); log.write(allowed)
                      if len(allowed)!=len(chunk):
                          overflow=True
                          try: os.killpg(p.pid,signal.SIGTERM)
                          except ProcessLookupError: pass
                          break
                  try: code=p.wait(timeout=10)
                  except subprocess.TimeoutExpired:
                      os.killpg(p.pid,signal.SIGKILL); code=p.wait()
                  results.append({'command':command,'exit':code,'seconds':round(time.monotonic()-started,3),'logOverflow':overflow})
                  (root/'postiz-build-result.json').write_text(json.dumps(results,indent=2))
                  if code or overflow: sys.exit(78 if overflow else (code if 0<code<256 else 1))
          PY
      - name: Retain immutable package and actual tool metadata
        timeout-minutes: 3
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/postiz-package"
          image=$(cat "$out/image-id")
          [[ "$image" =~ ^sha256:[0-9a-f]{64}$ ]]
          docker image inspect "$image" --format '{{json .Id}} {{json .Os}} {{json .Architecture}} {{json .Config.Labels}} {{json .Size}}' > "$RUNNER_TEMP/postiz-image-identity.json"
          docker image inspect node:22.20-bookworm-slim --format '{{json .Id}} {{json .Os}} {{json .Architecture}} {{json .RepoDigests}}' > "$RUNNER_TEMP/postiz-base-identity.json"
          holder=$(docker create "$image")
          trap 'docker rm "$holder" >/dev/null' EXIT
          docker cp "$holder:/usr/local/lib/node_modules/pm2/package.json" "$RUNNER_TEMP/postiz-pm2.json"
          docker cp "$holder:/usr/local/lib/node_modules/pnpm/package.json" "$RUNNER_TEMP/postiz-pnpm.json"
          # Stream uncompressed bytes through gzip; keep the existing 3GiB
          # file/transfer cap, and validate a separate finite expansion cap below.
          (ulimit -f 3145728; timeout --signal=TERM --kill-after=5 120 bash -o pipefail -c 'docker image save "$1" | gzip -1n > "$2"' _ "$image" "$out/postiz.docker.tar.gz")
          python3 - <<'PY'
          import gzip,hashlib,json,os,pathlib
          root=pathlib.Path(os.environ['RUNNER_TEMP']); out=root/'postiz-package'; archive=out/'postiz.docker.tar.gz'
          def digest(p):
              h=hashlib.sha256()
              with p.open('rb') as f:
                  while c:=f.read(1048576): h.update(c)
              return h.hexdigest()
          size=archive.stat().st_size
          if not 0<size<=3221225472: raise ValueError('archive bound')
          expanded=0; expanded_hash=hashlib.sha256()
          with gzip.open(archive,'rb') as f:
              while chunk:=f.read(min(1048576,8589934592-expanded+1)):
                  expanded+=len(chunk)
                  if expanded>8589934592: raise ValueError('8GiB archive expansion bound')
                  expanded_hash.update(chunk)
          if expanded==0: raise ValueError('empty archive expansion')
          image=(out/'image-id').read_text().strip()
          # Read only explicit nonsecret identity projections, never image environments.
          dec=json.JSONDecoder()
          def fields(p):
              s=p.read_text(); result=[]
              while s.strip():
                  s=s.lstrip(); value,end=dec.raw_decode(s); result.append(value); s=s[end:]
              return result
          identity=fields(root/'postiz-image-identity.json'); base=fields(root/'postiz-base-identity.json')
          if identity[0]!=image or identity[1:3]!=['linux','amd64'] or identity[3].get('org.opencontainers.image.revision')!='0e537d3935b30010bc1b9b621be56cb06083c31d' or identity[3].get('one.linktrend.source-tree')!='af402b533928f760d0067ecfb3ebc375d857c406': raise ValueError('image source/platform')
          receipt={'schema':'postiz.accepted-source-package/v1','repository':'linktrend/link-postiz-app','sourceCommit':'0e537d3935b30010bc1b9b621be56cb06083c31d','sourceTree':'af402b533928f760d0067ecfb3ebc375d857c406','sourceArchiveSha256':digest(root/'postiz-source.tar'),'workflowCommit':os.environ['GITHUB_SHA'],'producerRunId':int(os.environ['GITHUB_RUN_ID']),'platform':'linux/amd64','imageConfigId':image,'dockerArchive':{'encoding':'gzip','bytes':size,'sha256':digest(archive),'uncompressedBytes':expanded,'uncompressedSha256':expanded_hash.hexdigest(),'uncompressedLimitBytes':8589934592},'imageVirtualBytes':identity[4],'baseIdentity':base,'pnpmVersion':json.loads((root/'postiz-pnpm.json').read_text())['version'],'pm2Version':json.loads((root/'postiz-pm2.json').read_text())['version'],'nextPublicVersion':'accepted Dockerfile.dev default; no build override','securityAdmission':False,'signatureVerified':False,'deploymentExecuted':False,'qualificationRun':40618821088}
          (out/'package-receipt.json').write_text(json.dumps(receipt,indent=2)+'\n')
          if (out/'package-receipt.json').stat().st_size>262144: raise ValueError('receipt bound')
          (out/'image-id').unlink()
          if sum(p.stat().st_size for p in out.iterdir())>3222274048: raise ValueError('aggregate bound')
          PY
      - name: Upload exact package members
        timeout-minutes: 2
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: postiz-package-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/postiz-package/postiz.docker.tar.gz
            ${{ runner.temp }}/postiz-package/package-receipt.json
          compression-level: 0
          if-no-files-found: error
          retention-days: 7
      - name: Preserve bounded producer diagnostics
        if: always()
        timeout-minutes: 1
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: postiz-package-diagnostics-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/postiz-build.log
            ${{ runner.temp }}/postiz-build-result.json
            ${{ runner.temp }}/postiz-image-identity.json
            ${{ runner.temp }}/postiz-base-identity.json
          if-no-files-found: ignore
          retention-days: 7
